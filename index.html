<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ Việt Nam 3D - Interactive Map</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Thư viện Three.js, OrbitControls và D3.js (Loại bỏ GSAP để tránh lỗi xung đột tài nguyên) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
    <!-- Màn hình tải dữ liệu có khả năng hiển thị thông báo lỗi tự động -->
    <div id="loading">
        <div class="spinner"></div>
        <p id="loading-text">Đang khởi tạo không gian 3D & tải bản đồ Việt Nam...</p>
    </div>

    <!-- Tiêu đề & Hướng dẫn thao tác -->
    <header class="top-header">
        <h1>Bản Đồ Việt Nam 3D</h1>
        <p>Cuộn chuột để phóng to/thu nhỏ • Nhấn giữ chuột trái để xoay góc nhìn • Click vào tỉnh/thành để xem chi tiết</p>
    </header>

    <!-- Khung chứa Canvas 3D -->
    <div id="canvas-container"></div>

    <!-- Bảng thông tin chi tiết tỉnh thành (Glassmorphism UI) -->
    <aside id="info-panel" class="hidden">
        <button id="close-btn" title="Đóng bảng thông tin">&times;</button>
        <div class="province-badge">Tỉnh / Thành phố</div>
        <h2 id="province-name">Tên Tỉnh</h2>
        
        <div class="info-grid">
            <div class="info-card">
                <span class="label">👥 Dân số (ước tính)</span>
                <span class="value" id="province-pop">---</span>
            </div>
            <div class="info-card">
                <span class="label">📐 Diện tích</span>
                <span class="value" id="province-area">---</span>
            </div>
            <div class="info-card col-span-2">
                <span class="label">📍 Vùng miền địa lý</span>
                <span class="value" id="province-region">---</span>
            </div>
        </div>
    </aside>

    <script src="main.js"></script>
</body>
</html>
